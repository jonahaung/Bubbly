baseline: swiftlint-baseline.json

disabled_rules:
  - line_length
  - opening_brace
  - closing_brace
  - comma
  - colon
  - vertical_whitespace
  - vertical_whitespace_between_cases
  - statement_position
  - attributes
  - closure_spacing
  - control_statement
  - implicit_return
  - trailing_whitespace
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - closure_parameter_position

opt_in_rules:
  - array_init
  - closure_end_indentation
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - reduce_boolean
  - redundant_nil_coalescing
  - toggle_bool
  - unavailable_function
  - weak_delegate
  - syntactic_sugar

# ----------------------------------------
# FORCE SAFETY
# ----------------------------------------

force_cast: warning
force_try: warning

# ----------------------------------------
# NAMING
# ----------------------------------------

identifier_name:
  min_length: 1
  max_length: 40
  validates_start_with_lowercase: false
  allowed_symbols: ["_"]
  excluded:
    - id
    - ID
    - x
    - y
    - z
    - t
    - i
    - j
    - k
    - Color
    - Synced

type_name:
  min_length: 2

# ----------------------------------------
# COMPLEXITY (Enterprise)
# ----------------------------------------

function_body_length:
  warning: 120
  error: 180

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 800
  error: 1200

cyclomatic_complexity:
  warning: 20
  error: 35

function_parameter_count:
  warning: 8
  error: 12

large_tuple:
  warning: 4
  error: 6

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

# ----------------------------------------
# EXCLUDED PATHS
# ----------------------------------------

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - fastlane
  - vendor
  - Packages/Crypto
  - "**/Generated"
  - "**/*.generated.swift"
