disabled_rules: # rule identifiers to exclude from running
  - force_cast
  - identifier_name
  - todo
  - file_length
  - inclusive_language
  - comment_spacing
  - empty_enum_arguments
  - implicit_getter
  - valid_ibinspectable
  - blanket_disable_command

excluded:
  - Carthage
  - Pods
  - R.generated.swift
  - SGSwiftUI
  - EZ-PZ-iOS/SimplyGoMerge
  - EZ-PZ-iOS/TSJ
  - EZ-PZ-iOS/MonthlyStatement /
  - EZ-PZ-iOSTests
  - EZ-PZ-iOSUITests

# custom configuration		
line_length:
  ignores_interpolated_strings: true
  ignores_comments: true
  warning: 200 
  error: 300

type_name:
  min_length: 2 
  max_length: 
    warning: 60
    error: 80

trailing_whitespace:
  ignores_empty_lines: true

function_body_length:
  warning: 60
  error: 100

large_tuple:
  - 4

function_parameter_count:
  - 7

cyclomatic_complexity:
  ignores_case_statements: true
  warning: 20

force_try:
  severity: warning
